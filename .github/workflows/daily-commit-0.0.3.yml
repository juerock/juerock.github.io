# 设定 GitHub Actions 工作流 daily-commit.yml
# 每日0点、8点、16点，随机提交0-3次，记录到 daily-log.txt
# 格式：提交时间 | 当日提交次数 | 随机数

name: Daily Commit

on:
  schedule:
    # UTC时间 0:00, 8:00, 16:00 (北京时间 8:00, 16:00, 0:00)
    - cron: '0 0,8,16 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: Set up Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
      - name: Generate random commits
        run: |
          # 生成随机数 0-3
          COMMIT_COUNT=$((RANDOM % 4))
          echo "今日将提交 $COMMIT_COUNT 次"
          
          # 获取当前时间（北京时间）
          CURRENT_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          
          # 创建或更新 daily-log.txt
          if [ ! -f daily-log.txt ]; then
            echo "# Daily Commit Log" > daily-log.txt
            echo "" >> daily-log.txt
          fi
          
          # 记录本次执行信息
          RANDOM_NUM=$RANDOM
          echo "$CURRENT_TIME | 计划提交: $COMMIT_COUNT 次 | 随机数: $RANDOM_NUM" >> daily-log.txt
          
          # 提交 daily-log.txt 的更改
          git add daily-log.txt
          git commit -m "docs: 更新每日提交日志 [skip ci]" || echo "无需提交"
          
          # 执行随机次数的提交
          for i in $(seq 1 $COMMIT_COUNT); do
            TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            RANDOM_SEED=$RANDOM
            
            # 创建临时文件
            echo "# 提交 #$i" > temp_commit_$i.md
            echo "" >> temp_commit_$i.md
            echo "- 时间: $TIMESTAMP" >> temp_commit_$i.md
            echo "- 随机种子: $RANDOM_SEED" >> temp_commit_$i.md
            echo "- 提交序号: $i / $COMMIT_COUNT" >> temp_commit_$i.md
            
            git add temp_commit_$i.md
            git commit -m "chore: 自动化提交 #$i [skip ci]"
            
            # 添加短暂延迟，使提交时间略有差异
            sleep 1
          done
          
      - name: Push changes
        run: |
          git push
